name: Tests
on:
  push:
    branches-ignore: [docs-status]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv build
  newest-python:
    # No setup-python: uv installs the newest Python allowed by requires-python,
    # as it does for Glama builds and plugin users without a system Python.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --managed-python
      - run: uv run --frozen python --version
      - run: uv run --frozen python -m unittest discover -s tests -v
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the repository's own action on a fixture
        uses: ./
        with:
          path: tests/fixtures/action-bot
      - name: Strict mode fails on the fixture's warning
        id: strict
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/action-bot
          strict: "true"
      - run: test "${{ steps.strict.outcome }}" = failure
      - name: The fixture's warning is the reason
        run: |
          set +e
          uvx --from . telegram-dev check tests/fixtures/action-bot --strict > out.txt
          code=$?
          cat out.txt
          test "$code" = 1 && grep -q "reply_to_message_id\` was retired in Bot API 7.0" out.txt
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t telegram-dev:test .
      - name: Verify container runtime
        shell: bash
        run: |
          docker run -d --name telegram-dev-test -e TELEGRAM_DOC_AUTO_SYNC=0 telegram-dev:test
          docker exec telegram-dev-test /app/.venv/bin/python -c 'import urllib.request,time; time.sleep(3); print(urllib.request.urlopen("http://127.0.0.1:8000/healthz",timeout=5).read().decode())'
          docker exec telegram-dev-test test -w /data
          test "$(docker exec telegram-dev-test id -u)" != 0
      - name: Container logs
        if: failure()
        run: docker logs telegram-dev-test
      - name: Cleanup
        if: always()
        run: docker rm -f telegram-dev-test || true
