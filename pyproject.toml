[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-dev"
version = "0.6.1"
description = "Source-grounded Telegram development skills and documentation MCP"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
dependencies = ["mcp>=1.30,<2", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "markdownify>=1,<2", "platformdirs>=4,<5", "tomlkit>=0.13,<1"]

[project.scripts]
telegram-dev = "telegram_knowledge:main"

[tool.setuptools]
py-modules = ["telegram_knowledge", "telegram_dev_install"]
packages = ["telegram_dev_skill"]
package-dir = {"telegram_dev_skill" = "skills/telegram-dev"}

[tool.setuptools.package-data]
telegram_dev_skill = ["*.md", "agents/*.yaml", "references/*.md"]
