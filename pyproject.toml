[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-dev-knowledge"
version = "0.3.0"
description = "Source-grounded Telegram development skills and documentation MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1.30,<2", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "markdownify>=1,<2", "platformdirs>=4,<5", "tomlkit>=0.13,<1"]

[project.scripts]
telegram-dev = "telegram_knowledge:main"

[tool.setuptools]
py-modules = ["telegram_knowledge"]
